# /etc/nginx/sites-available/vivemedellin
# Django/Gunicorn + rate limits + bloqueo geo (CF-IPCountry)
#
# Tras copiar: nginx -t && systemctl reload nginx

include /etc/nginx/vivemedellin-geo-block.conf;

limit_req_zone $binary_remote_addr zone=vm_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=vm_static:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=vm_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=vm_addr:10m;

# Redirect www → apex (canonical para SEO / Search Console)
server {
    listen 80;
    listen [::]:80;
    server_name www.vivemedellin.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/medellin-project/public;
        allow all;
    }

    location / {
        return 301 https://vivemedellin.net$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vivemedellin.net;
    ssl_certificate /etc/letsencrypt/live/vivemedellin.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vivemedellin.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/medellin-project/public;
        allow all;
    }

    location / {
        return 301 https://vivemedellin.net$request_uri;
    }
}

# HTTP .net → HTTPS. Cloudflare en modo Full llega por el 80 cuando el visitante
# entra por http; sin este 301, Django ve X-Forwarded-Proto https y sirve 200.
# Certificado: certbot certonly --webroot -w /var/www/medellin-project/public \
#   -d vivemedellin.net -d www.vivemedellin.net
server {
    listen 80;
    listen [::]:80;
    server_name vivemedellin.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/medellin-project/public;
        allow all;
    }

    location / {
        return 301 https://vivemedellin.net$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vivemedellin.net;

    ssl_certificate /etc/letsencrypt/live/vivemedellin.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vivemedellin.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    limit_conn vm_addr 30;


    location ^~ /.well-known/acme-challenge/ {
        root /var/www/medellin-project/public;
        allow all;
    }
    location = /ads.txt {
        alias /var/www/medellin-project/public/ads.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # Bing Webmaster Tools (sin geo-block)
    location = /BingSiteAuth.xml {
        alias /var/www/medellin-project/public/BingSiteAuth.xml;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location = /robots.txt {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://unix:/run/gunicorn-vivemedellin.sock;
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location /static/ {
        alias /var/www/medellin-project/staticfiles/;
        limit_req zone=vm_static burst=100 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/medellin-project/media/;
        limit_req zone=vm_static burst=50 nodelay;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ ^/(api|es/api|en/api)/ {
        if ($geo_block_request) {
            return 403;
        }
        limit_req zone=vm_api burst=20 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_pass http://unix:/run/gunicorn-vivemedellin.sock;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location / {
        if ($geo_block_request) {
            return 403;
        }
        limit_req zone=vm_general burst=50 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_pass http://unix:/run/gunicorn-vivemedellin.sock;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
