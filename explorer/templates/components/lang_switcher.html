{% load i18n %}
{% load form_tags %}
{% get_current_language as LANGUAGE_CODE %}

{# Componente de cambio de idioma reutilizable para el header global #}
{# Enlaces, no formularios: el idioma va en el prefijo de la URL y sin csrf_token el HTML se puede cachear. #}
<div class="site-lang-switcher" aria-label="{% trans 'Cambiar idioma' %}">
    <a href="{% translate_url_to 'es' %}" hreflang="es" class="site-lang-switcher__btn {% if LANGUAGE_CODE == 'es' %}active{% endif %}" aria-label="{% trans 'Cambiar a español' %}{% if LANGUAGE_CODE == 'es' %} ({% trans 'idioma actual' %}){% endif %}">ES</a>
    <a href="{% translate_url_to 'en' %}" hreflang="en" class="site-lang-switcher__btn {% if LANGUAGE_CODE|slice:':2' == 'en' %}active{% endif %}" aria-label="{% trans 'Cambiar a inglés' %}{% if LANGUAGE_CODE|slice:':2' == 'en' %} ({% trans 'idioma actual' %}){% endif %}">EN</a>
</div>
